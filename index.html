<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pengolah Transkrip YouTube Arab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Cairo', system-ui, sans-serif; }
  .doc-page { background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.12); min-height:65vh; padding:2.5rem 3rem; border-radius:6px; outline:none; }
  #arEditor { direction: rtl; text-align: justify; font-family: 'Amiri','Traditional Arabic',serif; font-size: 1.6rem; line-height: 2.5; }
  #idEditor { direction: ltr; text-align: left; font-family: system-ui, sans-serif; font-size: 1.1rem; line-height: 1.8; }
  .doc-page p { margin-bottom: 1rem; }
  .tb { padding:.4rem .6rem; border-radius:.4rem; background:#fff; border:1px solid #d1d5db; font-size:.85rem; display:inline-flex; gap:.3rem; align-items:center; }
  .tb:hover { background:#ecfdf5; border-color:#10b981; }
  .tb:disabled { opacity:.5; cursor:wait; }
  .tab-on { background:#047857; color:#fff; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<header class="bg-emerald-800 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
    <h1 class="text-lg md:text-xl font-bold flex items-center gap-2"><i data-lucide="captions"></i> Pengolah Transkrip YouTube Arab</h1>
    <nav class="flex gap-1 bg-emerald-900/50 p-1 rounded-lg">
      <button data-tab="home" class="tabbtn px-3 py-1.5 rounded-md text-sm">1. Input</button>
      <button data-tab="ar" class="tabbtn px-3 py-1.5 rounded-md text-sm">2. Editor Arab</button>
      <button data-tab="id" class="tabbtn px-3 py-1.5 rounded-md text-sm">3. Terjemahan Indonesia</button>
    </nav>
    <button id="btnSettings" class="tb !bg-emerald-700 !text-white !border-emerald-600"><i data-lucide="settings" class="w-4 h-4"></i> Pengaturan</button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">

  <!-- ====== 1. DASHBOARD ====== -->
  <section id="tab-home" class="tab">
    <div class="bg-white rounded-xl shadow p-6 max-w-2xl mx-auto space-y-5">
      <h2 class="text-xl font-bold">Masukkan Video YouTube</h2>
      <div>
        <label class="block text-sm font-semibold mb-1">Link YouTube</label>
        <input id="ytUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." class="w-full border rounded-lg px-3 py-2 focus:ring-2 ring-emerald-500 outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Dari (mulai)</label>
          <input id="tStart" type="text" placeholder="0:00 atau 1:30:00" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Sampai (selesai)</label>
          <input id="tEnd" type="text" placeholder="kosong = sampai akhir" class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 ring-emerald-500" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Bahasa caption</label>
        <select disabled class="w-full border rounded-lg px-3 py-2 bg-slate-50"><option>العربية (Arab) — subtitle resmi / auto-generated</option></select>
      </div>
      <button id="btnExtract" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2">
        <i data-lucide="wand-sparkles"></i> Ekstrak &amp; Proses Transkrip
      </button>
      <p id="homeMsg" class="text-sm"></p>
    </div>
  </section>

  <!-- ====== 2. EDITOR ARAB ====== -->
  <section id="tab-ar" class="tab hidden">
    <div class="flex flex-wrap gap-2 mb-3 bg-white p-3 rounded-xl shadow sticky top-0 z-10">
      <button class="tb" onclick="fmt('undo')" title="Undo"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('redo')" title="Redo"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
      <span class="w-px bg-slate-300 mx-1"></span>
      <button class="tb" onclick="fmt('bold')"><i data-lucide="bold" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('italic')"><i data-lucide="italic" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('underline')"><i data-lucide="underline" class="w-4 h-4"></i></button>
      <span class="w-px bg-slate-300 mx-1"></span>
      <button class="tb" onclick="fmt('justifyRight')"><i data-lucide="align-right" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('justifyCenter')"><i data-lucide="align-center" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('justifyLeft')"><i data-lucide="align-left" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('justifyFull')"><i data-lucide="align-justify" class="w-4 h-4"></i></button>
      <span class="w-px bg-slate-300 mx-1"></span>
      <button class="tb" onclick="copyText('arEditor')"><i data-lucide="copy" class="w-4 h-4"></i> Salin</button>
      <button class="tb" onclick="exportDoc('arEditor','txt','arab')">.txt</button>
      <button class="tb" onclick="exportDoc('arEditor','doc','arab')">.doc</button>
      <button class="tb" onclick="exportDoc('arEditor','pdf','arab')">PDF</button>
    </div>
    <div class="flex flex-wrap gap-2 mb-3 bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
      <button id="btnCorrect" class="tb"><i data-lucide="spell-check" class="w-4 h-4"></i> Auto-Correction (تصحيح تلقائي)</button>
      <button id="btnFull" class="tb"><i data-lucide="type" class="w-4 h-4"></i> Auto-Tashkeel: Full Harokat (تشكيل كامل)</button>
      <button id="btnEnd" class="tb"><i data-lucide="text-cursor" class="w-4 h-4"></i> Harokat Akhir Kata / I'rab (إعراب)</button>
      <button id="btnToId" class="tb !bg-emerald-700 !text-white ml-auto"><i data-lucide="languages" class="w-4 h-4"></i> Terjemahkan ke Indonesia →</button>
      <p id="arMsg" class="w-full text-sm text-slate-600"></p>
    </div>
    <div id="arEditor" class="doc-page" contenteditable="true" dir="rtl" lang="ar" spellcheck="false"></div>
  </section>

  <!-- ====== 3. TERJEMAHAN ====== -->
  <section id="tab-id" class="tab hidden">
    <div class="flex flex-wrap gap-2 mb-3 bg-white p-3 rounded-xl shadow sticky top-0 z-10">
      <button class="tb" onclick="fmt('undo')"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('redo')"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('bold')"><i data-lucide="bold" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('italic')"><i data-lucide="italic" class="w-4 h-4"></i></button>
      <button class="tb" onclick="fmt('underline')"><i data-lucide="underline" class="w-4 h-4"></i></button>
      <span class="w-px bg-slate-300 mx-1"></span>
      <button id="btnRetranslate" class="tb"><i data-lucide="refresh-cw" class="w-4 h-4"></i> Terjemahkan ulang dari editor Arab</button>
      <button class="tb" onclick="copyText('idEditor')"><i data-lucide="copy" class="w-4 h-4"></i> Salin</button>
      <button class="tb" onclick="exportDoc('idEditor','txt','indonesia')">.txt</button>
      <button class="tb" onclick="exportDoc('idEditor','doc','indonesia')">.doc</button>
      <button class="tb" onclick="exportDoc('idEditor','pdf','indonesia')">PDF</button>
      <p id="idMsg" class="w-full text-sm text-slate-600"></p>
    </div>
    <div id="idEditor" class="doc-page" contenteditable="true" dir="ltr" lang="id"></div>
  </section>
</main>

<!-- Modal pengaturan -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl p-6 w-full max-w-md space-y-3">
    <h3 class="font-bold text-lg">Pengaturan AI (opsional)</h3>
    <p class="text-sm text-slate-600">Auto-Tashkeel &amp; perbaikan AI memakai Claude. Masukkan API key Anthropic (disimpan hanya di browser ini), atau set <code>ANTHROPIC_API_KEY</code> di server. Tanpa key, Auto-Correction tetap jalan memakai aturan lokal.</p>
    <input id="apiKey" type="password" placeholder="sk-ant-..." class="w-full border rounded-lg px-3 py-2" />
    <div class="flex justify-end gap-2">
      <button id="keyCancel" class="tb">Tutup</button>
      <button id="keySave" class="tb !bg-emerald-700 !text-white">Simpan</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let serverHasKey = false;

// ---------- Tabs ----------
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.add('hidden'));
  $('tab-' + name).classList.remove('hidden');
  document.querySelectorAll('.tabbtn').forEach((b) => b.classList.toggle('tab-on', b.dataset.tab === name));
}
document.querySelectorAll('.tabbtn').forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));

// ---------- Helpers ----------
const getText = (id) => $(id).innerText.replace(/\n{2,}/g, '\n').trim();
const setText = (id, text) => {
  $(id).innerHTML = text.split(/\n+/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('');
};
function parseTime(s) {
  s = (s || '').trim();
  if (!s) return null;
  const p = s.split(':').map(Number);
  if (p.some(isNaN)) return NaN;
  return p.reduce((a, v) => a * 60 + v, 0);
}
async function api(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}
function msg(id, text, err) { const e = $(id); e.textContent = text; e.className = 'text-sm ' + (err ? 'text-red-600' : 'text-slate-600'); }
function chunk(text, max = 1400) {
  const out = []; let cur = '';
  for (const para of text.split('\n')) {
    if ((cur + '\n' + para).length > max && cur) { out.push(cur); cur = para; } else cur = cur ? cur + '\n' + para : para;
  }
  if (cur) out.push(cur);
  return out;
}
const fmt = (cmd) => document.execCommand(cmd, false, null);
const stripTashkeel = (s) => s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');

// ---------- 1. Ekstrak ----------
$('btnExtract').onclick = async () => {
  const url = $('ytUrl').value.trim();
  const start = parseTime($('tStart').value), end = parseTime($('tEnd').value);
  if (!url) return msg('homeMsg', 'Isi link YouTube dulu.', true);
  if (Number.isNaN(start) || Number.isNaN(end)) return msg('homeMsg', 'Format waktu salah. Contoh: 1:30 atau 0:12:05', true);
  if (start != null && end != null && end <= start) return msg('homeMsg', 'Waktu selesai harus lebih besar dari waktu mulai.', true);
  $('btnExtract').disabled = true; msg('homeMsg', 'Mengambil caption...');
  try {
    const d = await api('/api/transcript', { url, start, end });
    // Gabungkan segmen jadi paragraf (jeda >2.5 detik atau >450 karakter = paragraf baru)
    const paras = []; let cur = '', lastEnd = null;
    for (const s of d.segments) {
      if (cur && ((lastEnd != null && s.start - lastEnd > 2.5) || cur.length > 450)) { paras.push(cur); cur = ''; }
      cur += (cur ? ' ' : '') + s.text; lastEnd = s.end;
    }
    if (cur) paras.push(cur);
    setText('arEditor', paras.join('\n'));
    $('idEditor').innerHTML = '';
    msg('homeMsg', `Berhasil: ${d.segments.length} segmen (${d.kind}).`);
    showTab('ar');
    msg('arMsg', `Sumber: ${d.kind}. Disarankan klik Auto-Correction lebih dulu.`);
  } catch (e) { msg('homeMsg', '❌ ' + e.message, true); }
  $('btnExtract').disabled = false;
};

// ---------- 2. Auto-Correction (aturan lokal) ----------
function localCorrect(text) {
  const Q = /^(هل|ما|ماذا|لماذا|كيف|أين|متى|من|كم|أي|أيّ|أيها|أ)\s/;
  return text.split('\n').map((p) => {
    p = p.replace(/\[[^\]]*\]|♪+|>>+/g, ' ')          // [موسيقى], ♪, >>
      .replace(/ـ/g, '')                                 // tatweel
      .replace(/,/g, '،').replace(/;/g, '؛').replace(/\?/g, '؟')
      .replace(/\bال\s+(?=[\u0621-\u064A])/g, 'ال')      // "ال كتاب" -> "الكتاب"
      .replace(/\s+([،؛؟.!:])/g, '$1')                   // spasi sebelum tanda baca
      .replace(/([،؛؟.!:])(?=[^\s\d"»)\]،؛؟.!:])/g, '$1 ') // spasi sesudah tanda baca
      .replace(/(^|\s)([\u0600-\u06FF]+)(\s+\2)+(?=\s|$)/g, '$1$2') // kata ganda berurutan
      .replace(/\s{2,}/g, ' ').trim();
    if (p && !/[.؟!…:]$/.test(p)) p += Q.test(p) ? '؟' : '.';
    return p;
  }).filter(Boolean).join('\n');
}

// ---------- AI per-chunk ----------
async function aiRun(task, btn, label) {
  const key = localStorage.getItem('anthropic_key') || '';
  if (!key && !serverHasKey) { $('modal').classList.remove('hidden'); return false; }
  let text = getText('arEditor'); if (!text) return false;
  if (task.startsWith('tashkeel')) text = stripTashkeel(text);
  const parts = chunk(text); const out = [];
  btn.disabled = true;
  try {
    for (let i = 0; i < parts.length; i++) {
      msg('arMsg', `${label}... bagian ${i + 1}/${parts.length}`);
      out.push((await api('/api/ai', { task, text: parts[i], apiKey: key })).text);
    }
    setText('arEditor', out.join('\n'));
    msg('arMsg', '✅ Selesai: ' + label);
    return true;
  } catch (e) { msg('arMsg', '❌ ' + e.message, true); return false; }
  finally { btn.disabled = false; }
}

$('btnCorrect').onclick = async () => {
  setText('arEditor', localCorrect(getText('arEditor')));
  msg('arMsg', '✅ Perapian lokal selesai (spasi, tanda baca, kata ganda).');
  if (localStorage.getItem('anthropic_key') || serverHasKey) {
    if (await aiRun('correct', $('btnCorrect'), 'Koreksi AI (kata terpotong/salah sambung)'))
      setText('arEditor', localCorrect(getText('arEditor')));
  }
};
$('btnFull').onclick = () => aiRun('tashkeel_full', $('btnFull'), 'Memberi harakat penuh');
$('btnEnd').onclick = () => aiRun('tashkeel_end', $('btnEnd'), "Memberi harakat akhir kata (i'rab)");

// ---------- 3. Terjemahan ----------
async function translateAr() {
  const text = stripTashkeel(getText('arEditor'));
  if (!text) return msg('idMsg', 'Editor Arab masih kosong.', true);
  showTab('id'); $('btnRetranslate').disabled = true;
  const parts = chunk(text), out = [];
  try {
    for (let i = 0; i < parts.length; i++) {
      msg('idMsg', `Menerjemahkan... ${i + 1}/${parts.length}`);
      const paras = parts[i].split('\n');
      // terjemahkan per paragraf agar struktur terjaga
      for (const p of paras) out.push((await api('/api/translate', { text: p })).text);
    }
    setText('idEditor', out.join('\n'));
    msg('idMsg', '✅ Selesai. Anda bisa menyunting hasilnya langsung.');
  } catch (e) { msg('idMsg', '❌ ' + e.message, true); }
  $('btnRetranslate').disabled = false;
}
$('btnToId').onclick = translateAr;
$('btnRetranslate').onclick = () => { if (!$('idEditor').innerText.trim() || confirm('Terjemahan saat ini akan ditimpa. Lanjutkan?')) translateAr(); };

// ---------- Salin & Ekspor ----------
async function copyText(id) {
  await navigator.clipboard.writeText($(id).innerText);
  msg(id === 'arEditor' ? 'arMsg' : 'idMsg', '✅ Tersalin ke clipboard.');
}
function download(name, mime, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportDoc(id, type, name) {
  const el = $(id), rtl = id === 'arEditor';
  const css = `body{font-family:${rtl ? "'Traditional Arabic','Amiri',serif" : 'Arial,sans-serif'};font-size:${rtl ? '18pt' : '12pt'};line-height:1.9;direction:${rtl ? 'rtl' : 'ltr'};text-align:${rtl ? 'justify' : 'left'}}`;
  const html = `<html dir="${rtl ? 'rtl' : 'ltr'}"><head><meta charset="utf-8"><style>${css}</style></head><body>${el.innerHTML}</body></html>`;
  if (type === 'txt') download(`transkrip-${name}.txt`, 'text/plain;charset=utf-8', '\ufeff' + el.innerText);
  else if (type === 'doc') download(`transkrip-${name}.doc`, 'application/msword;charset=utf-8', '\ufeff' + html);
  else { const w = window.open('', '_blank'); w.document.write(html); w.document.close(); w.onload = () => w.print(); setTimeout(() => w.print(), 600); }
}

// ---------- Pengaturan ----------
$('btnSettings').onclick = () => { $('apiKey').value = localStorage.getItem('anthropic_key') || ''; $('modal').classList.remove('hidden'); };
$('keyCancel').onclick = () => $('modal').classList.add('hidden');
$('keySave').onclick = () => { localStorage.setItem('anthropic_key', $('apiKey').value.trim()); $('modal').classList.add('hidden'); };

// ---------- Init ----------
fetch('/api/status').then((r) => r.json()).then((j) => (serverHasKey = j.hasKey)).catch(() => {});
lucide.createIcons();
showTab('home');
</script>
</body>
</html>
